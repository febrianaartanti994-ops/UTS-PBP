<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding-invitation</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <audio id="bgm" autoplay loop>
      <source src="./assets/lagu.mp3" type="audio/mpeg" />
      Browsermu tidak mendukung tag audio.
    </audio>

    <div class="hero-butterfly" id="butterfly">
      <img src="./assets/b1.png" alt="b1" id="bf-1" class="butterfly1" />
      <img src="./assets/b2.png" alt="b1" id="bf-2" class="butterfly2" />
    </div>

    <header class="site-header">
      <div class="logo">Invitation</div>
      <nav>
        <a href="#">Home</a>
        <a href="#contain">content</a>
        <a href="#gift">Gift</a>
        <a href="#rsvp">RSVP</a>
      </nav>
    </header>

    <section class="hero" id="hero">
      <h1 class="hero-tittle">Artha & Rafael</h1>
      <img
        src="./assets/kiri.png"
        class="hero-bunga bunga-kiri"
        alt="bunga-kiri"
      />
      <img
        src="./assets/kanan.png"
        class="hero-bunga bunga-kanan"
        alt="bunga-kanan"
      />

      <div class="flower-wrap">
        <svg class="curve-svg">
          <path
            class="curve-path"
            d="M -500 0 A 500 320 0 0 0 500 0"
            fill="none"
          />
        </svg>

        <div class="flower img-1">
          <img src="./assets/flower.png" alt="bunga-1" class="flw-img" />
        </div>
        <div class="flower img-2">
          <img src="./assets/flower.png" alt="bunga-1" class="flw-img" />
        </div>

        <div class="flower img-3">
          <img src="./assets/flower.png" alt="bunga-1" class="flw-img" />
        </div>

        <div class="flower img-4">
          <img src="./assets/flower.png" alt="bunga-1" class="flw-img" />
        </div>

        <div class="flower img-5">
          <img src="./assets/flower.png" alt="bunga-1" class="flw-img" />
        </div>
      </div>
    </section>

    <section class="contain" id="contain">
      <div class="contain-iner">
        <div class="contain-left">
          <p class="contain-sub">
            WE EXPECT YOUR PRECENCE <br />
            AT OUR WEDDING
          </p>
          <h3 class="contain-name">
            Chén Artha <br />
            & <br />
            Rafael Camara
          </h3>
          <p class="contain-sub-date">SAVE THE DATE</p>
          <p class="contain-date">Friday, 26 Februari 2027</p>
          <p class="contain-time">08.00 PM</p>
          <p class="containt-tPlace">PLACE</p>
          <p class="contain-place">The Alexandria Ballrooms</p>
        </div>
      </div>
    </section>
    <section class="Gift" id="gift">
      <p class="gift-here">Gift Here</p>
      <img src="./assets/qris.jpeg" alt="Kode" class="qris" />
    </section>

    <section class="rsvp" id="rsvp">
      <div class="rsvp-form">
        <h2 class="rsvp-title">RSVP</h2>
        <p class="rsvp-note">respond by 06/04/26</p>
        <form method="post" enctype="text/plain">
          <div class="rsvp-choice">
            <label class="rsvp-radio">
              <input type="radio" name="Kehadiran" value="Accept" required />
              <span class="rsvp-dot"></span>ACCEPT
            </label>
            <label class="rsvp-radio">
              <input type="radio" name="Kehadiran" value="Decline" />
              <span class="rsvp-dot"></span>DECLINE
            </label>
          </div>

          <label class="rsvp-label" for="rsvp-names">NAMES</label>
          <input type="text" id="rsvp-names" name="Nama" required />

          <button type="submit">SEND</button>
        </form>
      </div>
    </section>
    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollToPlugin.min.js"></script>
  </body>
</html>
